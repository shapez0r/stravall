# Scaled-out stack: N stateless app replicas behind nginx, MariaDB as the
# shared database and Valkey as the shared cache.
#   docker compose -f compose.scale.yaml up -d --build
#   docker compose -f compose.scale.yaml up -d --scale eurofish=5   (then: docker compose -f compose.scale.yaml restart lb)
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: eurofish
      MARIADB_USER: eurofish
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-change-me}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-change-me-too}"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  eurofish:
    build: .
    image: eurofish:latest
    restart: unless-stopped
    deploy:
      replicas: 3
    environment:
      EUROFISH_DB_DRIVER: mariadb
      EUROFISH_DB_DSN: "eurofish:${MARIADB_PASSWORD:-change-me}@tcp(mariadb:3306)/eurofish?charset=utf8mb4"
      EUROFISH_CACHE_URL: redis://valkey:6379/0
      EUROFISH_PROXY_HEADER: X-Forwarded-For
      EUROFISH_ALLOW_SIGNUP: "${EUROFISH_ALLOW_SIGNUP:-true}"
      EUROFISH_SIGNUP_CIDRS: "${EUROFISH_SIGNUP_CIDRS:-}"
      EUROFISH_COOKIE_SECURE: "${EUROFISH_COOKIE_SECURE:-false}"
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${EUROFISH_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      eurofish:
        condition: service_healthy

volumes:
  mariadb-data:
