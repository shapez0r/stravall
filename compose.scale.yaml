# Scaled-out stack: N stateless app replicas behind nginx, MariaDB as the
# shared database and Valkey as the shared cache.
#   docker compose -f compose.scale.yaml up -d --build
#   docker compose -f compose.scale.yaml up -d --scale stravall=5   (then: docker compose -f compose.scale.yaml restart lb)
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    command: ["--max-allowed-packet=64M"]
    environment:
      MARIADB_DATABASE: stravall
      MARIADB_USER: stravall
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-change-me}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-change-me-too}"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  stravall:
    build: .
    image: stravall:latest
    restart: unless-stopped
    deploy:
      replicas: 3
    environment:
      STRAVALL_DB_DRIVER: mariadb
      STRAVALL_DB_DSN: "stravall:${MARIADB_PASSWORD:-change-me}@tcp(mariadb:3306)/stravall?charset=utf8mb4"
      STRAVALL_CACHE_URL: redis://valkey:6379/0
      STRAVALL_PROXY_HEADER: X-Forwarded-For
      STRAVALL_GOOGLE_MAPS_KEY: "${STRAVALL_GOOGLE_MAPS_KEY:-}"
      STRAVALL_MAX_UPLOAD_MB: "${STRAVALL_MAX_UPLOAD_MB:-512}"
      STRAVALL_ALLOW_SIGNUP: "${STRAVALL_ALLOW_SIGNUP:-true}"
      STRAVALL_SIGNUP_CIDRS: "${STRAVALL_SIGNUP_CIDRS:-}"
      STRAVALL_COOKIE_SECURE: "${STRAVALL_COOKIE_SECURE:-false}"
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${STRAVALL_PORT:-8082}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      stravall:
        condition: service_healthy

volumes:
  mariadb-data:
