# Round-robin load balancer for the eurofish replicas (compose.scale.yaml).
worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's DNS returns one A record per replica; nginx balances across them.
  upstream eurofish {
    server eurofish:8080;
    keepalive 32;
  }

  server {
    listen 80;
    client_max_body_size 1m;

    location / {
      proxy_pass http://eurofish;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite (never append) so clients cannot spoof their address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
