# Single node: one container, SQLite on a volume, in-process cache.
# Perfect for a laptop or home-lab PC.   docker compose up -d --build
services:
  eurofish:
    build: .
    image: eurofish:latest
    restart: unless-stopped
    ports:
      - "${EUROFISH_PORT:-8080}:8080"
    environment:
      EUROFISH_ALLOW_SIGNUP: "${EUROFISH_ALLOW_SIGNUP:-true}"
      EUROFISH_SIGNUP_CIDRS: "${EUROFISH_SIGNUP_CIDRS:-}"
      EUROFISH_COOKIE_SECURE: "${EUROFISH_COOKIE_SECURE:-false}"
      EUROFISH_SESSION_TTL: "${EUROFISH_SESSION_TTL:-720h}"
    volumes:
      - eurofish-data:/data

volumes:
  eurofish-data:
