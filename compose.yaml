# Single node: one container, SQLite on a volume, in-process cache.
# Perfect for a laptop or home-lab PC.   docker compose up -d --build
services:
  stravall:
    build: .
    image: stravall:latest
    restart: unless-stopped
    ports:
      - "${STRAVALL_PORT:-8082}:8082"
    environment:
      STRAVALL_GOOGLE_MAPS_KEY: "${STRAVALL_GOOGLE_MAPS_KEY:-}"
      STRAVALL_MAX_UPLOAD_MB: "${STRAVALL_MAX_UPLOAD_MB:-512}"
      STRAVALL_ALLOW_SIGNUP: "${STRAVALL_ALLOW_SIGNUP:-true}"
      STRAVALL_SIGNUP_CIDRS: "${STRAVALL_SIGNUP_CIDRS:-}"
      STRAVALL_COOKIE_SECURE: "${STRAVALL_COOKIE_SECURE:-false}"
      STRAVALL_SESSION_TTL: "${STRAVALL_SESSION_TTL:-720h}"
    volumes:
      - stravall-data:/data

volumes:
  stravall-data:
