# Round-robin load balancer for the stravall replicas (compose.scale.yaml).
worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's DNS returns one A record per replica; nginx balances across them.
  upstream stravall {
    server stravall:8082;
    keepalive 32;
  }

  server {
    listen 80;
    # Whole Strava exports are uploaded in one request; keep in sync with
    # STRAVALL_MAX_UPLOAD_MB.
    client_max_body_size 512m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
      proxy_pass http://stravall;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite (never append) so clients cannot spoof their address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
